<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiecesofJoy — Handmade Ceramics</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:           #e8f0f9;
      --bg-dots:      #ccddf0;
      --card-bg:      #f0f6ff;
      --card-bg2:     #e4eefa;
      --text-primary: #1a2740;
      --text-secondary:#4a6080;
      --accent:       #3a6fc4;
      --accent-dark:  #2a539a;
      --accent-light: #c8dcf7;
      --accent-pale:  #deeafa;
      --border:       #b8cfe8;
      --shadow:       0 3px 14px rgba(30,60,120,0.10);
      --shadow-hover: 0 14px 44px rgba(30,60,120,0.18);
      --squiggle:     #7aaee8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 480px; height: 480px;
      background: #8ab8f0;
      top: -120px; left: -120px;
    }
    body::after {
      width: 380px; height: 380px;
      background: #a8ccf5;
      bottom: -100px; right: -80px;
    }

    header, main, footer { position: relative; z-index: 1; }

    header {
      padding: 3.5rem 2rem 2.5rem;
      text-align: center;
    }

    .header-inner {
      display: inline-block;
      position: relative;
    }

    .header-inner::before, .header-inner::after {
      content: '✦';
      position: absolute;
      color: var(--accent);
      opacity: 0.55;
      font-size: 1rem;
    }
    .header-inner::before { top: -10px; left: -28px; transform: rotate(-15deg); }
    .header-inner::after  { bottom: 4px; right: -26px; transform: rotate(20deg); font-size: 0.7rem; }

    .eyebrow {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: 100px;
      padding: 0.25rem 0.9rem;
      margin-bottom: 0.8rem;
    }

    h1 {
      font-family: 'Lora', serif;
      font-size: clamp(2.2rem, 5.5vw, 3.6rem);
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .header-sub {
      margin-top: 0.8rem;
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-secondary);
      max-width: 400px;
      margin-inline: auto;
      line-height: 1.6;
    }

    .squiggle {
      display: block;
      margin: 1.6rem auto 0;
      width: 120px;
      overflow: visible;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 2.5rem 2rem 5rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 1.8rem;
    }

    /* ── Loading & Error states ── */
    .state-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .spinner {
      display: inline-block;
      width: 36px; height: 36px;
      border: 3px solid var(--accent-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      color: #c0392b;
      background: #fdf0ee;
      border: 1px solid #f5c6c0;
      border-radius: 12px;
      padding: 1.2rem 1.6rem;
      max-width: 480px;
      margin: 0 auto;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
      opacity: 0;
      transform: translateY(22px);
      animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1) forwards;
    }

    .card:nth-child(even) { background: var(--card-bg2); }

    .card:hover {
      transform: translateY(-8px) rotate(-0.5deg);
      box-shadow: var(--shadow-hover);
    }

    .card::after {
      content: '✿';
      position: absolute;
      top: 10px; right: 13px;
      font-size: 0.85rem;
      color: var(--accent);
      opacity: 0.4;
      pointer-events: none;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    .card-image-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-pale));
      font-size: 3.5rem;
    }

    .card-body {
      padding: 1.2rem 1.4rem 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-category {
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }

    .card-name {
      font-family: 'Lora', serif;
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 0.45rem;
    }

    .card-description {
      font-size: 0.84rem;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.6;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.15rem;
      padding-top: 0.95rem;
      border-top: 1.5px dashed var(--border);
    }

    .card-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .card-price .cur {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-right: 1px;
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 0.45rem 1.1rem;
      font-family: 'Nunito', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.18s cubic-bezier(.34,1.56,.64,1);
      letter-spacing: 0.02em;
    }

    .btn-add:hover {
      background: var(--accent-dark);
      transform: scale(1.08);
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.78rem;
      color: var(--text-secondary);
      border-top: 1.5px dashed var(--border);
    }
    footer span { color: var(--accent); }

    @keyframes popIn {
      to { opacity: 1; transform: translateY(0) rotate(0deg); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <p class="eyebrow">✦ Handmade with love ✦</p>
    <h1>Clay &amp; <em>Cobalt</em></h1>
    <p class="header-sub">Whimsical, one-of-a-kind ceramics thrown by hand in a little studio by the sea.</p>
  </div>
  <svg class="squiggle" viewBox="0 0 120 12" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 6 Q10 0 20 6 Q30 12 40 6 Q50 0 60 6 Q70 12 80 6 Q90 0 100 6 Q110 12 120 6"
          stroke="#7aaee8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </svg>
</header>

<main>
  <div class="product-grid" id="grid">
    <div class="state-message">
      <div class="spinner"></div>
      <p>Loading products…</p>
    </div>
  </div>
</main>

<footer>
  <span>✦</span> &copy; 2026 Clay &amp; Cobalt. Made with muddy hands &amp; a big heart. <span>✦</span>
</footer>

<script>
  // ─── Configuration ────────────────────────────────────────────────
  const SHEET_CSV_URL =
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZulSWSsDogtn19EchY2E0-wG7YIb1Jdeb9-TncrwvqPXSraXGFUUxZZ2DNCdP-DR1Ao7VQt3v1iPe/pub?output=csv';

  const CURRENCY = '$'; // Change to ₩, £, € etc.
  // ─────────────────────────────────────────────────────────────────

  // Minimal CSV parser that handles quoted fields with commas/newlines
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') { field += '"'; i++; }
        else if (ch === '"') { inQuotes = false; }
        else { field += ch; }
      } else {
        if (ch === '"') { inQuotes = true; }
        else if (ch === ',') { row.push(field.trim()); field = ''; }
        else if (ch === '\n' || (ch === '\r' && next === '\n')) {
          row.push(field.trim()); field = '';
          if (row.some(c => c !== '')) rows.push(row);
          row = [];
          if (ch === '\r') i++;
        } else { field += ch; }
      }
    }
    if (field || row.length) { row.push(field.trim()); if (row.some(c => c !== '')) rows.push(row); }
    return rows;
  }

  // Normalise a header string for flexible matching
  function norm(s) { return s.toLowerCase().replace(/[^a-z]/g, ''); }

  function findCol(headers, ...candidates) {
    for (const c of candidates) {
      const idx = headers.findIndex(h => norm(h) === norm(c));
      if (idx !== -1) return idx;
    }
    // partial match fallback
    for (const c of candidates) {
      const idx = headers.findIndex(h => norm(h).includes(norm(c)));
      if (idx !== -1) return idx;
    }
    return -1;
  }

  async function loadProducts() {
    const grid = document.getElementById('grid');

    try {
      const res = await fetch(SHEET_CSV_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const rows = parseCSV(text);

      if (rows.length < 2) throw new Error('Sheet appears to be empty.');

      // ── Map columns flexibly ──
      const headers = rows[0];
      const col = {
        name:        findCol(headers, 'name', 'product', 'productname', 'title'),
        category:    findCol(headers, 'category', 'type', 'cat'),
        description: findCol(headers, 'description', 'desc', 'details', 'about'),
        price:       findCol(headers, 'price', 'cost', 'amount'),
        image:       findCol(headers, 'image', 'img', 'imageurl', 'photo', 'url'),
        emoji:       findCol(headers, 'emoji', 'icon'),
      };

      const products = rows.slice(1)
        .map(r => ({
          name:        col.name        >= 0 ? r[col.name]        : '',
          category:    col.category    >= 0 ? r[col.category]    : '',
          description: col.description >= 0 ? r[col.description] : '',
          price:       col.price       >= 0 ? parseFloat(r[col.price]) || 0 : 0,
          image:       col.image       >= 0 ? r[col.image]       : '',
          emoji:       col.emoji       >= 0 ? r[col.emoji]       : '🏺',
        }))
        .filter(p => p.name);  // skip blank rows

      if (products.length === 0) throw new Error('No products found in the sheet.');

      // ── Render ──
      grid.innerHTML = '';
      products.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${0.04 + i * 0.05}s`;

        const imageHTML = p.image
          ? `<img class="card-image" src="${p.image}" alt="${p.name}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
             <div class="card-image-placeholder" style="display:none">${p.emoji || '🏺'}</div>`
          : `<div class="card-image-placeholder">${p.emoji || '🏺'}</div>`;

        const formattedPrice = p.price
          ? p.price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
          : '—';

        card.innerHTML = `
          ${imageHTML}
          <div class="card-body">
            ${p.category ? `<p class="card-category">${p.category}</p>` : ''}
            <h2 class="card-name">${p.name}</h2>
            <p class="card-description">${p.description}</p>
            <div class="card-footer">
              <div class="card-price"><span class="cur">${CURRENCY}</span>${formattedPrice}</div>
              <button class="btn-add">Add to cart</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

    } catch (err) {
      grid.innerHTML = `
        <div class="state-message">
          <div class="error-msg">
            <strong>Couldn't load products.</strong><br>
            ${err.message}<br><br>
            Make sure the Google Sheet is published:
            <em>File → Share → Publish to web → CSV</em>.
          </div>
        </div>`;
    }
  }

  loadProducts();
</script>

</body>
</html>
